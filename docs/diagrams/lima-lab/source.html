<title>Lima Lab Diagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f5f6f8; --surface: #ffffff; --ink: #18212c; --muted: #58636f; --rule: #d7dce3;
  --host: #a55a0b; --host-wash: #fbf1e4; --remote: #0e6f68; --remote-wash: #e3f3f1;
  --gap: #b3261e; --gap-wash: #fbe9e7; --none: #6b7684; --none-wash: #eef0f3;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
    --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
    --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e131a; --surface: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
  --host: #f0a53c; --host-wash: #2a2014; --remote: #3fcfc0; --remote-wash: #122a28;
  --gap: #f2857c; --gap-wash: #2d1614; --none: #9aa5b3; --none-wash: #1b232d;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; }
.page { max-width: 1060px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 72px; display: grid; gap: 44px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.15; margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 20px; margin: 0 0 6px; font-weight: 600; text-wrap: balance; }
p { margin: 0; max-width: 72ch; }
.lede { font-size: 17px; max-width: 70ch; }
code { font-family: var(--font-mono); font-size: .9em; }
section { display: grid; gap: 14px; }
figure { margin: 0; display: grid; gap: 10px; }
.fig-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; }
.fig-scroll svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--muted); max-width: 80ch; }
</style>

<div class="page">
  <header>
    <div class="eyebrow">openshift-ipsec-nas · lab · 2026-10-02</div>
    <h1>The Lima lab: a test NAS and two stand-in workers</h1>
    <p class="lede">One figure for <code>docs/lab-lima-guide.md</code>: what the lab builds on a Mac and the three things it checks. Every statement in it was measured on the lab on 2026-10-02.</p>
  </header>

  <section>
    <h2>What the lab checks</h2>
    <figure>
      <div class="fig-scroll">
        <!-- Two lanes: the stand-in workers and the test NAS, three Lima VMs on one network. Time flows down through the three checks. -->
        <svg viewBox="0 0 980 414" role="img" aria-label="The Lima lab runs a test NAS and two stand-in workers as VMs on one network. It checks three things: cleartext NFS is dropped by the NAS, each worker gets an IKEv2 tunnel using certificates, and data written to the NFS mount is counted on the tunnel as ESP.">
          <defs>
            <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
            <marker id="ahlr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--remote)"/></marker>
            <marker id="ahlg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gap)"/></marker>
          </defs>
          <g font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600">
            <rect x="20" y="14" width="380" height="30" rx="6" fill="var(--host-wash)" stroke="var(--host)"/>
            <text x="210" y="34" text-anchor="middle" fill="var(--host)">STAND-IN WORKERS · 2 Lima VMs</text>
            <rect x="580" y="14" width="380" height="30" rx="6" fill="var(--remote-wash)" stroke="var(--remote)"/>
            <text x="770" y="34" text-anchor="middle" fill="var(--remote)">TEST NAS · 1 Lima VM</text>
          </g>
          <line x1="490" y1="78" x2="490" y2="322" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="6 5"/>

          <g font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor">
            <text x="30" y="68" fill="var(--muted)">Lima user-v2 network 192.168.104.0/24: the VMs reach each other directly and resolve each other as lima-&lt;vm&gt;.internal</text>

            <!-- check 1: cleartext is dropped -->
            <rect x="30" y="84" width="360" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <text x="44" y="106" font-weight="600">A worker with no tunnel yet</text>
            <text x="44" y="123" font-family="IBM Plex Mono, monospace" font-size="12">mount -t nfs4 lima-lab-nas.internal:/export</text>
            <text x="44" y="139" fill="var(--muted)">tried before libreswan is set up on the worker</text>
            <line x1="392" y1="115" x2="588" y2="115" stroke="var(--gap)" stroke-width="1.5" marker-end="url(#ahlg)"/>
            <rect x="428" y="94" width="124" height="16" fill="var(--surface)"/>
            <text x="490" y="106" text-anchor="middle" font-weight="600" fill="var(--gap)">NFS in cleartext</text>
            <rect x="452" y="120" width="76" height="16" fill="var(--surface)"/>
            <text x="490" y="132" text-anchor="middle" fill="var(--muted)">tcp/2049</text>
            <rect x="590" y="84" width="360" height="62" rx="8" fill="var(--gap-wash)" stroke="var(--gap)" stroke-width="1.5"/>
            <text x="604" y="106" font-weight="600" fill="var(--gap)">① Dropped by the NAS firewall</text>
            <text x="604" y="123">nftables: NFS only when it arrived through IPsec</text>
            <text x="604" y="139">the mount gets no answer</text>

            <!-- check 2: one tunnel per worker -->
            <rect x="30" y="172" width="360" height="62" rx="8" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.5"/>
            <text x="44" y="194" font-weight="600" fill="var(--host)">lab-worker1, lab-worker2</text>
            <text x="44" y="211">libreswan conn ipsec-nas: the NNCP's settings</text>
            <text x="44" y="227">certificate left_server, one per worker</text>
            <line x1="392" y1="203" x2="588" y2="203" stroke="currentColor" stroke-width="1.2" marker-start="url(#ahl)" marker-end="url(#ahl)"/>
            <rect x="436" y="182" width="108" height="16" fill="var(--surface)"/>
            <text x="490" y="194" text-anchor="middle" font-weight="600">IKEv2 · UDP 500</text>
            <rect x="416" y="208" width="148" height="16" fill="var(--surface)"/>
            <text x="490" y="220" text-anchor="middle" fill="var(--muted)">certificates, both ways</text>
            <rect x="590" y="172" width="360" height="62" rx="8" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.5"/>
            <text x="604" y="194" font-weight="600" fill="var(--remote)">② One tunnel per worker</text>
            <text x="604" y="211">libreswan conn workers: answers any peer that holds</text>
            <text x="604" y="227">a certificate from the test CA · transport mode</text>

            <!-- check 3: data is counted on the tunnel -->
            <line x1="210" y1="234" x2="210" y2="258" stroke="currentColor" stroke-width="1.2" marker-end="url(#ahl)"/>
            <line x1="770" y1="234" x2="770" y2="258" stroke="var(--remote)" stroke-width="1.2" marker-end="url(#ahlr)"/>
            <rect x="30" y="260" width="360" height="62" rx="8" fill="var(--host-wash)" stroke="var(--host)" stroke-width="1.5"/>
            <text x="44" y="282" font-weight="600" fill="var(--host)">Mount and write</text>
            <text x="44" y="299" font-family="IBM Plex Mono, monospace" font-size="12">lima-lab-nas.internal:/export on /mnt/nas</text>
            <text x="44" y="315">5 MiB of random data, then fsync</text>
            <line x1="392" y1="291" x2="588" y2="291" stroke="var(--remote)" stroke-width="1.8" marker-start="url(#ahlr)" marker-end="url(#ahlr)"/>
            <rect x="420" y="270" width="140" height="16" fill="var(--surface)"/>
            <text x="490" y="282" text-anchor="middle" font-weight="600" fill="var(--remote)">ESP · IP protocol 50</text>
            <rect x="418" y="296" width="144" height="16" fill="var(--surface)"/>
            <text x="490" y="308" text-anchor="middle" fill="var(--muted)">NFS inside, encrypted</text>
            <rect x="590" y="260" width="360" height="62" rx="8" fill="var(--remote-wash)" stroke="var(--remote)" stroke-width="1.5"/>
            <text x="604" y="282" font-weight="600" fill="var(--remote)">③ Counted on the tunnel</text>
            <text x="604" y="299">NFSv4 server shares /export with the worker subnet</text>
            <text x="604" y="315">the tunnel's byte counter grows by at least 5 MiB</text>

            <text x="30" y="354" fill="var(--muted)">The NAS runs either as a RHEL-style host (systemd services) or as one privileged container on that VM. Both pass the same checks.</text>
            <text x="30" y="374" fill="var(--muted)">Measured 2026-10-02 with Lima 2.2.0 on CentOS Stream 10 (libreswan 5.4), the upstream of RHEL 10.</text>
            <text x="30" y="394" fill="var(--host)" font-weight="600">The workers are plain libreswan hosts using the NNCP's settings. No OpenShift cluster is involved.</text>
          </g>
        </svg>
      </div>
      <figcaption>The lab runs a test NAS and two stand-in workers as Lima VMs on one network and checks three things: cleartext NFS is dropped, each worker gets a certificate-authenticated IKEv2 tunnel, and data written to the mount is counted on the tunnel as ESP.</figcaption>
    </figure>
  </section>
</div>
