apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-metrics-scripts
  namespace: kcs-ipsec
data:
  collect.sh: |
    #!/bin/bash
    # ipsec-nas metrics collector: runs on every worker, beside the cert-sync container.
    # Every COLLECT_EVERY seconds it asks the HOST's libreswan about the ipsec-nas connection, the
    # HOST's NSS database about the node certificate, and the HOST's kernel about IPsec errors and
    # NFS mounts, and writes the answers as Prometheus metrics into a file. The unprivileged
    # "metrics" container serves that file. Every metric carries node=<this pod's node>.
    # It only reads: nothing on the host is changed.
    set -uo pipefail

    NSS_DB=/var/lib/ipsec/nss
    CERT_NICK=left_server
    CONN_NAME=ipsec-nas
    # written by sync.sh after each successful certificate import
    STAMP=/host/etc/pki/certs/kcs-ipsec/.installed-sha256
    OUT_FILE=/metrics/ipsec_nas.prom
    COLLECT_EVERY=30
    # The pod has its own network and mount namespaces; the node's are those of the host's PID 1
    # (the host's /proc is mounted at /host/proc).
    XFRM_STAT=/host/proc/1/net/xfrm_stat
    HOST_MOUNTS=/host/proc/1/mounts

    # The UUID of the NetworkManager connection the NNCP created; empty if NetworkManager has none.
    # NetworkManager hands a connection to libreswan under its UUID, so on a node "ipsec
    # trafficstatus" shows the UUID and not "ipsec-nas". collect() falls back to the plain name,
    # which is what a hand-written libreswan connection uses.
    nm_connection_uuid() {
      chroot /host nmcli -g connection.uuid connection show "${CONN_NAME}" 2>/dev/null | head -1
    }

    # Reads "ipsec status" on stdin and prints 1 if the connection named $1 has an established IKE
    # SA, else 0. libreswan 5 writes ESTABLISHED_IKE_SA, libreswan 4 STATE_V2_ESTABLISHED_IKE_SA.
    ike_sa_established() {
      if grep -F "\"$1\"" | grep -q 'ESTABLISHED_IKE_SA'; then echo 1; else echo 0; fi
    }

    # Reads /proc/net/xfrm_stat on stdin and prints "<counter> <value>" for each kernel IPsec error
    # counter (XfrmInNoStates, XfrmOutPolBlock, ...).
    xfrm_counters() {
      awk 'NF == 2 && $1 ~ /^Xfrm[A-Za-z]+$/ && $2 ~ /^[0-9]+$/ { print $1, $2 }'
    }

    # Reads a mounts table (/proc/<pid>/mounts) on stdin and prints "<server> <count>" for the NFS
    # mounts, per server. The source of an NFS mount is "<server>:/<path>"; an IPv6 server is in [].
    nfs_mount_servers() {
      awk '$3 == "nfs" || $3 == "nfs4" { src = $1; sub(/:\/.*$/, "", src); n[src]++ }
           END { for (s in n) print s, n[s] }' | LC_ALL=C sort
    }

    # Reads "ipsec trafficstatus" on stdin and prints, for the newest tunnel of the connection
    # named $1 (default: CONN_NAME):
    #   <add_time> <inBytes> <outBytes> <peer id>
    # libreswan 4 starts each line with "006 ", libreswan 5 does not. Both are matched, because
    # the fields are found by name and not by position.
    tunnel_fields() {
      awk -v conn="\"${1:-${CONN_NAME}}\"" -v q="'" '
        index($0, conn) {
          t = ""; i = ""; o = ""; id = ""
          if (match($0, /add_time=[0-9]+/)) t = substr($0, RSTART + 9, RLENGTH - 9)
          if (match($0, /inBytes=[0-9]+/))  i = substr($0, RSTART + 8, RLENGTH - 8)
          if (match($0, /outBytes=[0-9]+/)) o = substr($0, RSTART + 9, RLENGTH - 9)
          if (match($0, "id=" q "[^" q "]*" q)) id = substr($0, RSTART + 4, RLENGTH - 5)
          if (t != "" && i != "" && o != "" && t + 0 >= best + 0) { best = t; line = t " " i " " o " " id }
        }
        END { if (line != "") print line }'
    }

    # Prometheus label values: backslash, double quote and newline must be escaped
    label_escape() { sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' <<<"$1"; }

    collect() {
      local now status rc fields up=0 add_time="" in_bytes="" out_bytes="" peer="" end not_after="" imported="" version node
      local uuid conn configured cert_present ike="" xfrm="" mounts=""
      now=$(date +%s)
      node=$(label_escape "${NODE_NAME}")
      uuid=$(nm_connection_uuid)
      conn="${uuid:-${CONN_NAME}}"
      configured=$([[ -n "${uuid}" ]] && echo 1 || echo 0)

      status=$(chroot /host ipsec trafficstatus 2>/dev/null)
      rc=$?
      if [[ ${rc} -eq 0 ]]; then
        ike=$(chroot /host ipsec status 2>/dev/null | ike_sa_established "${conn}")
        fields=$(tunnel_fields "${conn}" <<<"${status}")
        if [[ -n "${fields}" ]]; then
          up=1
          read -r add_time in_bytes out_bytes peer <<<"${fields}"
        fi
      fi

      cert_present=0
      chroot /host certutil -L -n "${CERT_NICK}" -d "${NSS_DB}" >/dev/null 2>&1 && cert_present=1
      [[ -r "${XFRM_STAT}" ]] && xfrm=$(xfrm_counters < "${XFRM_STAT}")
      [[ -r "${HOST_MOUNTS}" ]] && mounts=$(nfs_mount_servers < "${HOST_MOUNTS}")
      end=$(chroot /host bash -c "certutil -L -n ${CERT_NICK} -d ${NSS_DB} -a 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null" | cut -d= -f2)
      [[ -n "${end}" ]] && not_after=$(date -u -d "${end}" +%s 2>/dev/null)
      [[ -e "${STAMP}" ]] && imported=$(stat -c %Y "${STAMP}" 2>/dev/null)
      version=$(chroot /host ipsec --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+' | head -1)

      {
        echo "# HELP ipsec_nas_collect_success 1 if libreswan on the node answered the collector, 0 if it did not."
        echo "# TYPE ipsec_nas_collect_success gauge"
        echo "ipsec_nas_collect_success{node=\"${node}\"} $(( rc == 0 ? 1 : 0 ))"
        echo "# HELP ipsec_nas_collect_timestamp_seconds When the collector last ran."
        echo "# TYPE ipsec_nas_collect_timestamp_seconds gauge"
        echo "ipsec_nas_collect_timestamp_seconds{node=\"${node}\"} ${now}"
        echo "# HELP ipsec_nas_tunnel_up 1 if the node has an established IPsec tunnel to the NAS, 0 if not."
        echo "# TYPE ipsec_nas_tunnel_up gauge"
        echo "ipsec_nas_tunnel_up{node=\"${node}\",connection=\"${CONN_NAME}\"} ${up}"
        if [[ ${up} -eq 1 ]]; then
          echo "# HELP ipsec_nas_tunnel_info The identity the NAS presented, from its certificate."
          echo "# TYPE ipsec_nas_tunnel_info gauge"
          echo "ipsec_nas_tunnel_info{node=\"${node}\",connection=\"${CONN_NAME}\",peer_id=\"$(label_escape "${peer}")\"} 1"
          echo "# HELP ipsec_nas_tunnel_established_timestamp_seconds When the current tunnel was established."
          echo "# TYPE ipsec_nas_tunnel_established_timestamp_seconds gauge"
          echo "ipsec_nas_tunnel_established_timestamp_seconds{node=\"${node}\",connection=\"${CONN_NAME}\"} ${add_time}"
          echo "# HELP ipsec_nas_tunnel_in_bytes_total Bytes received through the current tunnel. Starts again from 0 when the tunnel is re-established."
          echo "# TYPE ipsec_nas_tunnel_in_bytes_total counter"
          echo "ipsec_nas_tunnel_in_bytes_total{node=\"${node}\",connection=\"${CONN_NAME}\"} ${in_bytes}"
          echo "# HELP ipsec_nas_tunnel_out_bytes_total Bytes sent through the current tunnel. Starts again from 0 when the tunnel is re-established."
          echo "# TYPE ipsec_nas_tunnel_out_bytes_total counter"
          echo "ipsec_nas_tunnel_out_bytes_total{node=\"${node}\",connection=\"${CONN_NAME}\"} ${out_bytes}"
        fi
        if [[ -n "${not_after}" ]]; then
          echo "# HELP ipsec_nas_certificate_not_after_timestamp_seconds When the node certificate in the NSS database expires."
          echo "# TYPE ipsec_nas_certificate_not_after_timestamp_seconds gauge"
          echo "ipsec_nas_certificate_not_after_timestamp_seconds{node=\"${node}\",nickname=\"${CERT_NICK}\"} ${not_after}"
        fi
        if [[ -n "${imported}" ]]; then
          echo "# HELP ipsec_nas_certificate_import_timestamp_seconds When cert-sync last imported a certificate into the NSS database."
          echo "# TYPE ipsec_nas_certificate_import_timestamp_seconds gauge"
          echo "ipsec_nas_certificate_import_timestamp_seconds{node=\"${node}\"} ${imported}"
        fi
        echo "# HELP ipsec_nas_connection_configured 1 if NetworkManager on the node has the ipsec-nas connection (the NNCP was applied), 0 if not."
        echo "# TYPE ipsec_nas_connection_configured gauge"
        echo "ipsec_nas_connection_configured{node=\"${node}\",connection=\"${CONN_NAME}\"} ${configured}"
        echo "# HELP ipsec_nas_certificate_present 1 if the node certificate is in the node's NSS database, 0 if not."
        echo "# TYPE ipsec_nas_certificate_present gauge"
        echo "ipsec_nas_certificate_present{node=\"${node}\",nickname=\"${CERT_NICK}\"} ${cert_present}"
        if [[ -n "${ike}" ]]; then
          echo "# HELP ipsec_nas_ike_sa_established 1 if the node has an established IKE SA with the NAS (the login), 0 if not. ipsec_nas_tunnel_up is the IPsec SA that carries the traffic."
          echo "# TYPE ipsec_nas_ike_sa_established gauge"
          echo "ipsec_nas_ike_sa_established{node=\"${node}\",connection=\"${CONN_NAME}\"} ${ike}"
        fi
        if [[ -n "${xfrm}" ]]; then
          echo "# HELP ipsec_nas_xfrm_errors_total The node kernel's IPsec error counters (/proc/net/xfrm_stat of the host). Counted for all IPsec traffic of the node."
          echo "# TYPE ipsec_nas_xfrm_errors_total counter"
          while read -r counter value; do
            echo "ipsec_nas_xfrm_errors_total{node=\"${node}\",counter=\"${counter}\"} ${value}"
          done <<<"${xfrm}"
        fi
        if [[ -n "${mounts}" ]]; then
          echo "# HELP ipsec_nas_nfs_mounts NFS mounts on the node, per NFS server."
          echo "# TYPE ipsec_nas_nfs_mounts gauge"
          while read -r server count; do
            echo "ipsec_nas_nfs_mounts{node=\"${node}\",server=\"$(label_escape "${server}")\"} ${count}"
          done <<<"${mounts}"
        fi
        if [[ -n "${version}" ]]; then
          echo "# HELP ipsec_nas_libreswan_info The libreswan version on the node."
          echo "# TYPE ipsec_nas_libreswan_info gauge"
          echo "ipsec_nas_libreswan_info{node=\"${node}\",version=\"$(label_escape "${version}")\"} 1"
        fi
      } > "${OUT_FILE}.tmp"
      # rename, so the metrics container never serves a half-written file
      mv "${OUT_FILE}.tmp" "${OUT_FILE}"
    }

    main() {
      echo "$(date -u +%FT%TZ) [${NODE_NAME}] collecting every ${COLLECT_EVERY}s into ${OUT_FILE}"
      while true; do
        collect
        sleep "${COLLECT_EVERY}"
      done
    }

    # Run only when executed, so that the tests can load the functions above without starting the loop
    if [[ "${BASH_SOURCE[0]}" == "${0}" ]]; then
      main
    fi
  serve.py: |
    #!/usr/bin/env python3
    """Serves the metrics file written by the collector container, and nothing else."""
    import http.server
    import os

    METRICS_FILE = os.environ.get("METRICS_FILE", "/metrics/ipsec_nas.prom")
    PORT = int(os.environ.get("METRICS_PORT", "9754"))


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                try:
                    with open(METRICS_FILE, "rb") as f:
                        self._send(200, f.read(), "text/plain; version=0.0.4; charset=utf-8")
                except OSError as err:
                    # 503 makes the scrape fail, which is what should happen while there is no data
                    self._send(503, f"metrics file not readable: {err}\n".encode(), "text/plain")
            elif self.path == "/healthz":
                self._send(200, b"ok\n", "text/plain")
            else:
                self._send(404, b"not found\n", "text/plain")

        def _send(self, code, body, content_type):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            # one scrape every 30 seconds per node would bury every other line in the pod log
            pass


    if __name__ == "__main__":
        print(f"serving {METRICS_FILE} on :{PORT}/metrics", flush=True)
        http.server.ThreadingHTTPServer(("", PORT), Handler).serve_forever()
