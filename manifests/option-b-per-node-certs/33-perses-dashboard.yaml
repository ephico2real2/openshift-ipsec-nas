      "panels": {
        "0_0": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Workers that have an established IPsec tunnel to the NAS.",
              "name": "Tunnels up"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "value",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "sum(ipsec_nas_tunnel_up{node=~\"$node\"})",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "0_1": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Workers that report no tunnel. Anything above 0 needs attention.",
              "name": "Tunnels down"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "background_solid",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    },
                    {
                      "color": "#f2495c",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "count(ipsec_nas_tunnel_up{node=~\"$node\"} == 0) or vector(0)",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "0_2": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Workers whose ipsec-cert-sync pod is being scraped.",
              "name": "Workers reporting"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "value",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "count(ipsec_nas_collect_timestamp_seconds{node=~\"$node\"})",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "0_3": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Days until the first node certificate expires. cert-manager renews 30 days before expiry.",
              "name": "Soonest certificate expiry"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "value",
                "format": {
                  "decimalPlaces": 1,
                  "unit": "days"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#f2495c",
                      "value": 0
                    },
                    {
                      "color": "#fade2a",
                      "value": 14
                    },
                    {
                      "color": "#73bf69",
                      "value": 30
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "min(ipsec_nas_certificate_not_after_timestamp_seconds{node=~\"$node\"} - time()) / 86400",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "1_0": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "UP when the node has an established tunnel to the NAS.",
              "name": "Tunnel state per node"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "background_solid",
                "format": {
                  "unit": "decimal"
                },
                "mappings": [
                  {
                    "kind": "Value",
                    "spec": {
                      "result": {
                        "color": "#f2495c",
                        "value": "DOWN"
                      },
                      "value": "0"
                    }
                  },
                  {
                    "kind": "Value",
                    "spec": {
                      "result": {
                        "color": "#73bf69",
                        "value": "UP"
                      },
                      "value": "1"
                    }
                  }
                ],
                "thresholds": {
                  "steps": [
                    {
                      "color": "#f2495c",
                      "value": 0
                    },
                    {
                      "color": "#73bf69",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "ipsec_nas_tunnel_up{node=~\"$node\"}",
                      "seriesNameFormat": "{{node}}"
                    }
                  }
                }
              }
            ]
          }
        },
        "1_1": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "From the certificate in each node's NSS database, which is what libreswan actually uses.",
              "name": "Certificate days left per node"
            },
            "plugin": {
              "kind": "BarChart",
              "spec": {
                "calculation": "last-number",
                "format": {
                  "decimalPlaces": 1,
                  "unit": "days"
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "(ipsec_nas_certificate_not_after_timestamp_seconds{node=~\"$node\"} - time()) / 86400",
                      "seriesNameFormat": "{{node}}"
                    }
                  }
                }
              }
            ]
          }
        },
        "1_2": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Bytes per second sent to and received from the NAS through IPsec. NFS traffic shows up here.",
              "name": "Traffic through the tunnel"
            },
            "plugin": {
              "kind": "TimeSeriesChart",
              "spec": {
                "legend": {
                  "mode": "list",
                  "position": "bottom"
                },
                "visual": {
                  "areaOpacity": 0.1,
                  "lineWidth": 1
                },
                "yAxis": {
                  "format": {
                    "unit": "bytes/sec"
                  }
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "rate(ipsec_nas_tunnel_out_bytes_total{node=~\"$node\"}[5m])",
                      "seriesNameFormat": "{{node}} to NAS"
                    }
                  }
                }
              },
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "rate(ipsec_nas_tunnel_in_bytes_total{node=~\"$node\"}[5m])",
                      "seriesNameFormat": "{{node}} from NAS"
                    }
                  }
                }
              }
            ]
          }
        },
        "1_3": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Time since the current tunnel was established. A small value on one node means it was re-established recently.",
              "name": "Tunnel age per node"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "value",
                "format": {
                  "unit": "seconds"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "time() - ipsec_nas_tunnel_established_timestamp_seconds{node=~\"$node\"}",
                      "seriesNameFormat": "{{node}}"
                    }
                  }
                }
              }
            ]
          }
        },
        "1_4": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Time since the collector last ran. More than 5 minutes means the collector container stopped.",
              "name": "Metrics age per node"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "value",
                "format": {
                  "unit": "seconds"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    },
                    {
                      "color": "#fade2a",
                      "value": 120
                    },
                    {
                      "color": "#f2495c",
                      "value": 300
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "time() - ipsec_nas_collect_timestamp_seconds{node=~\"$node\"}",
                      "seriesNameFormat": "{{node}}"
                    }
                  }
                }
              }
            ]
          }
        },
        "1_5": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "The libreswan version installed on each node.",
              "name": "libreswan version per node"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "none",
                "format": {
                  "unit": "decimal"
                },
                "metricLabel": "version",
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "ipsec_nas_libreswan_info{node=~\"$node\"}",
                      "seriesNameFormat": "{{node}}"
                    }
                  }
                }
              }
            ]
          }
        },
        "2_0": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Nodes with more than one ipsec-cert-sync pod reporting (alert IpsecNasDuplicateNode). Must be 0.",
              "name": "Nodes reported twice"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "background_solid",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    },
                    {
                      "color": "#f2495c",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "count(count by (node) (ipsec_nas_collect_timestamp_seconds{node=~\"$node\"}) > 1) or vector(0)",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "2_1": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Pods whose node label differs from the node Kubernetes placed them on (alert IpsecNasNodeLabelMismatch). Must be 0.",
              "name": "Pods reporting the wrong node"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "background_solid",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    },
                    {
                      "color": "#f2495c",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "count(ipsec_nas_collect_timestamp_seconds{node=~\"$node\",exporter_node!=\"\"} unless on (node, pod) label_replace(ipsec_nas_collect_timestamp_seconds, \"node\", \"$1\", \"exporter_node\", \"(.+)\")) or vector(0)",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "2_2": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "Packets the kernel IPsec code dropped in the last hour, over every selected node: the sum of the counters in /proc/net/xfrm_stat, each of which counts drops for one reason.",
              "name": "Kernel IPsec errors, last hour"
            },
            "plugin": {
              "kind": "StatChart",
              "spec": {
                "calculation": "last-number",
                "colorMode": "background_solid",
                "format": {
                  "unit": "decimal"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "#73bf69",
                      "value": 0
                    },
                    {
                      "color": "#f2495c",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "queries": [
              {
                "kind": "TimeSeriesQuery",
                "spec": {
                  "plugin": {
                    "kind": "PrometheusTimeSeriesQuery",
                    "spec": {
                      "datasource": {
                        "kind": "PrometheusDatasource",
                        "name": "ipsec-nas-thanos"
                      },
                      "query": "sum(increase(ipsec_nas_xfrm_errors_total{node=~\"$node\"}[1h])) or vector(0)",
                      "seriesNameFormat": ""
                    }
                  }
                }
              }
            ]
          }
        },
        "3_0": {
          "kind": "Panel",
          "spec": {
            "display": {
              "description": "One row per node. Why a tunnel is down: no certificate, no connection (NNCP), no IKE SA, or libreswan not answering. NFS requests/s comes from the platform's node-exporter. The reporting pod and the NAS identity of each node whose tunnel is up are in the table below.",
              "name": "Per node"
            },
            "plugin": {
              "kind": "Table",
              "spec": {
                "columnSettings": [
                  {
                    "header": "Node",
                    "name": "node",
                    "width": 170
                  },
                  {
                    "cellSettings": [
                      {
                        "backgroundColor": "#f2495c",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "0"
                          }
                        },
                        "text": "DOWN"
                      },
                      {
                        "backgroundColor": "#73bf69",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "1"
                          }
                        },
                        "text": "UP"
                      }
                    ],
                    "header": "Tunnel",
                    "name": "value #1",
                    "width": 90
                  },
                  {
                    "cellSettings": [
                      {
                        "backgroundColor": "#f2495c",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "0"
                          }
                        },
                        "text": "NO"
                      },
                      {
                        "backgroundColor": "#73bf69",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "1"
                          }
                        },
                        "text": "YES"
                      }
                    ],
                    "header": "IKE SA",
                    "name": "value #2",
                    "width": 80
                  },
                  {
                    "cellSettings": [
                      {
                        "backgroundColor": "#f2495c",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "0"
                          }
                        },
                        "text": "MISSING"
                      },
                      {
                        "backgroundColor": "#73bf69",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "1"
                          }
                        },
                        "text": "PRESENT"
                      }
                    ],
                    "header": "Certificate",
                    "name": "value #3",
                    "width": 110
                  },
                  {
