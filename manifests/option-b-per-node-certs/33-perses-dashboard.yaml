# The Perses dashboard (Cluster Observability Operator 1.5 or later) and the datasource it queries.
# GENERATED by scripts/perses-dashboard.sh from charts/ipsec-nas/files/ipsec-nas.json: do not edit by hand.
# Viewers need cluster-monitoring-view (Thanos port 9091): docs/61-perses-dashboard-review.md, "Decision".
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: ipsec-nas-thanos
  namespace: kcs-ipsec
  labels:
    app: ipsec-cert-sync
spec:
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
  config:
    display:
      name: OpenShift Thanos (cluster)
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
            # the Perses secret COO derives from spec.client.tls; the proxy must name it
            secret: ipsec-nas-thanos-secret
---
