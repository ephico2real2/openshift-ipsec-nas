                          }
                        },
                        "text": "MISSING"
                      },
                      {
                        "backgroundColor": "#73bf69",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "1"
                          }
                        },
                        "text": "YES"
                      }
                    ],
                    "header": "Connection",
                    "name": "value #4",
                    "width": 110
                  },
                  {
                    "cellSettings": [
                      {
                        "backgroundColor": "#f2495c",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "0"
                          }
                        },
                        "text": "NO"
                      },
                      {
                        "backgroundColor": "#73bf69",
                        "condition": {
                          "kind": "Value",
                          "spec": {
                            "value": "1"
                          }
                        },
                        "text": "YES"
                      }
                    ],
                    "header": "libreswan",
                    "name": "value #5",
                    "width": 90
                  },
                  {
                    "header": "NFS mounts",
                    "name": "value #6",
                    "width": 110
                  },
                  {
                    "format": {
                      "unit": "requests/sec"
                    },
                    "header": "NFS requests/s",
                    "name": "value #7",
                    "width": 110
                  },
                  {
                    "header": "IPsec drops (1h)",
