apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ipsec-cert-sync
  namespace: kcs-ipsec
spec:
  selector:
    matchLabels:
      app: ipsec-cert-sync
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ipsec-cert-sync
    spec:
      serviceAccountName: ipsec-cert-sync
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      # Add tolerations here if some workers are tainted (e.g. infra nodes that mount the NAS)
      containers:
      - name: sync
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command: ["/bin/bash", "/scripts/sync.sh"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: host
          mountPath: /host
        - name: node-cert
          mountPath: /certs
          readOnly: true
        - name: trust-ca
          mountPath: /ca
          readOnly: true
        - name: script
          mountPath: /scripts
          readOnly: true
      # Reads the tunnel and certificate state from the host every 30 seconds and writes it as
      # Prometheus metrics into the shared "metrics" volume. The host is mounted read-only.
      - name: collector
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command: ["/bin/bash", "/metrics-scripts/collect.sh"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: host
          mountPath: /host
          readOnly: true
        - name: metrics
          mountPath: /metrics
        - name: metrics-scripts
          mountPath: /metrics-scripts
          readOnly: true
      # Serves the collector's file on :9754/metrics. Unprivileged: the only network listener in
      # this pod has no access to the host.
      - name: metrics
        image: registry.access.redhat.com/ubi9/python-312:latest
        command: ["python3", "/metrics-scripts/serve.py"]
        ports:
        - name: metrics
          containerPort: 9754
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 30
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: metrics
          mountPath: /metrics
          readOnly: true
        - name: metrics-scripts
          mountPath: /metrics-scripts
          readOnly: true
      volumes:
      - name: host
        hostPath:
          path: /
          type: Directory
      - name: node-cert
        secret:
          secretName: ipsec-cert-unassigned   # replaced per node by Kyverno policy ipsec-cert-sync-mount
          optional: false
      - name: trust-ca
        configMap:
          name: ipsec-trust-ca
      - name: script
        configMap:
          name: ipsec-cert-sync-script
          defaultMode: 0555
      - name: metrics
        emptyDir: {}
      - name: metrics-scripts
        configMap:
          name: ipsec-metrics-scripts
          defaultMode: 0555
