apiVersion: v1
kind: ServiceAccount
metadata:
  name: ipsec-cert-sync
  namespace: kcs-ipsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipsec-cert-sync-label-node
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipsec-cert-sync-label-node
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipsec-cert-sync-label-node
subjects:
- kind: ServiceAccount
  name: ipsec-cert-sync
  namespace: kcs-ipsec
