# When a Node is deleted, Kyverno deletes that node's Certificate (policy ipsec-node-certificate,
# synchronize). cert-manager leaves the Certificate's Secret behind, with the node's private key in
# it. This policy removes such leftovers: every 5 minutes it deletes the cert-manager Secrets in this
# namespace whose Certificate no longer exists. It works in this namespace only, and touches no
# other Certificate or Secret on the cluster.
# A reboot does not delete the Node, so it never triggers this: the Certificate and Secret stay.
# Needs 31-cleanup-rbac.yaml. The legacy CleanupPolicy is in kyverno-legacy/.
apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: ipsec-orphaned-node-secrets
  namespace: kcs-ipsec
spec:
  schedule: "*/5 * * * *"
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["secrets"]
    objectSelector:
      matchLabels:
        controller.cert-manager.io/fao: "true"
  variables:
  # In a namespaced policy, resource.List reads this namespace only: (apiVersion, resource).
  - name: certificates
    expression: >-
      dyn(resource.List("cert-manager.io/v1", "certificates").items).map(c, c.metadata.name)
  conditions:
  - name: a-node-certificate-secret
    expression: object.metadata.name.startsWith("ipsec-cert-")
  # the Certificate this Secret belongs to (cert-manager writes it as an annotation) is gone
  - name: its-certificate-is-gone
    expression: >-
      !(object.metadata.?annotations[?"cert-manager.io/certificate-name"].orValue("") in variables.certificates)
