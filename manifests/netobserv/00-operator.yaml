# Red Hat's Network Observability Operator, for the IPsec spike (issue #35). Lab only: it is a
# cluster-wide operator, installed into its own namespace as Red Hat's documentation does.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-netobserv-operator
  labels:
    # lets the platform Prometheus scrape the operator's own metrics
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-netobserv-operator
  namespace: openshift-netobserv-operator
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: netobserv-operator
  namespace: openshift-netobserv-operator
spec:
  channel: stable
  name: netobserv-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
