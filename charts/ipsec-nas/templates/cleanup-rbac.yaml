{{- if .Values.nodeCleanup.deleteOrphanedSecrets }}
# Kyverno's cleanup controller runs the policy that deletes orphaned node Secrets (either kind).
# It gets the rights for it in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cleanup-ipsec-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-cleanup-ipsec-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-cleanup-ipsec-secrets
subjects:
- kind: ServiceAccount
  name: kyverno-cleanup-controller
  namespace: {{ .Values.prerequisites.kyvernoNamespace }}
{{- end }}
