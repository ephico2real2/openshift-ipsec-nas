{{- if .Values.nodeCleanup.deleteOrphanedSecrets }}
# When a Node is deleted, Kyverno deletes that node's Certificate (policy ipsec-node-certificate,
# synchronize: true). cert-manager leaves the Certificate's Secret behind, with the node's
# private key in it. This policy removes such leftovers: every 5 minutes it deletes the
# cert-manager Secrets in this namespace whose Certificate no longer exists.
# A reboot does not delete the Node, so it never triggers this: the Certificate and Secret stay.
#
# Kyverno's cleanup controller gets the rights for it in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-cleanup-ipsec-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-cleanup-ipsec-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-cleanup-ipsec-secrets
subjects:
- kind: ServiceAccount
  name: kyverno-cleanup-controller
  namespace: {{ .Values.prerequisites.kyvernoNamespace }}
---
apiVersion: kyverno.io/v2
kind: CleanupPolicy
metadata:
  name: ipsec-orphaned-node-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: {{ .Values.nodeCleanup.schedule | quote }}
  match:
    any:
    - resources:
        kinds:
        - Secret
        names:
        - "ipsec-cert-*"
        selector:
          matchLabels:
            controller.cert-manager.io/fao: "true"
  context:
  - name: certificates
    apiCall:
      urlPath: "/apis/cert-manager.io/v1/namespaces/{{ .Release.Namespace }}/certificates"
      jmesPath: "items[].metadata.name || `[]`"
  conditions:
    all:
    # the Certificate this Secret belongs to (cert-manager writes it as an annotation) is gone
    - key: "{{ "{{" }} target.metadata.annotations.\"cert-manager.io/certificate-name\" || '' {{ "}}" }}"
      operator: AnyNotIn
      value: "{{ "{{" }} certificates {{ "}}" }}"
{{- end }}
