apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: ipsec-node-certificate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Ignore
  rules:
  - name: certificate-per-worker
    match:
      any:
      - resources:
          kinds:
          - Node
          selector:
            matchLabels:
              {{- include "ipsec-nas.nodeMatchLabels" . | nindent 14 }}
    {{- include "ipsec-nas.kyvernoExclude" . | nindent 4 }}
    generate:
      generateExisting: true
      synchronize: {{ .Values.nodeCleanup.deleteCertificate }}          # Certificate is deleted when the Node is deleted
      apiVersion: cert-manager.io/v1
      kind: Certificate
      name: "ipsec-{{ "{{" }} request.object.metadata.name {{ "}}" }}"
      namespace: {{ .Release.Namespace }}
      data:
        spec:
          secretName: "ipsec-cert-{{ "{{" }} request.object.metadata.name {{ "}}" }}"
          commonName: "{{ "{{" }} request.object.metadata.name {{ "}}" }}.{{ .Values.nodeDomain }}"   # max 64 chars, must not start with ovs_
          dnsNames:
          - "{{ "{{" }} request.object.metadata.name {{ "}}" }}.{{ .Values.nodeDomain }}"
          duration: {{ .Values.certificate.duration }}
          renewBefore: {{ .Values.certificate.renewBefore }}
          privateKey:
            algorithm: RSA         # NNCP uses leftrsasigkey: '%cert'
            size: {{ .Values.certificate.keySize }}
            rotationPolicy: Always # new key on every renewal
          usages:
          - digital signature
          - key encipherment
          - server auth
          - client auth
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: {{ .Values.clusterIssuer }}       # the existing enterprise CA issuer
