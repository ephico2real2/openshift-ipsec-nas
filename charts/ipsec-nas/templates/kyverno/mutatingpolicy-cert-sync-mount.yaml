{{- if not .Values.kyverno.legacyPolicies }}
# Gives each cert-sync pod its node's Secret. The DaemonSet controller pins each pod to its node with
# a matchFields term on metadata.name. Kyverno 1.19 and later; the legacy ClusterPolicy is in
# templates/kyverno-legacy/.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: ipsec-cert-sync-mount
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: []        # only Pods, no rules generated for the DaemonSet
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
    objectSelector:
      matchLabels:
        app: ipsec-cert-sync
  variables:
  - name: node
    expression: >-
      object.spec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.?nodeSelectorTerms[?0].?matchFields[?0].?values[?0].orValue("")
  matchConditions:
  - name: pinned-to-a-node
    expression: >-
      object.spec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.?nodeSelectorTerms[?0].?matchFields[?0].?values[?0].orValue("") != ""
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{
          spec: Object.spec{
            volumes: [
              Object.spec.volumes{
                name: "node-cert",
                secret: Object.spec.volumes.secret{
                  secretName: "ipsec-cert-" + variables.node
                }
              }
            ]
          }
        }
{{- end }}
