{{- if not .Values.kyverno.legacyPolicies }}
# One Certificate per selected Node. Kyverno 1.19 and later; the legacy ClusterPolicy is in templates/kyverno-legacy/.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: ipsec-node-certificate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  evaluation:
    generateExisting:
      enabled: true          # nodes that exist before the policy get a Certificate too
    synchronize:
      enabled: {{ .Values.nodeCleanup.deleteCertificate }}          # the Certificate is deleted when the Node is deleted
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["nodes"]
    objectSelector:
      {{- include "ipsec-nas.nodeObjectSelector" (dict "root" $) | nindent 6 }}
  generate:
  - template:
      interpolate: cel
      value: |
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: ipsec-(( object.metadata.name ))
          namespace: {{ .Release.Namespace }}
        spec:
          secretName: ipsec-cert-(( object.metadata.name ))
          commonName: (( object.metadata.name )).{{ .Values.nodeDomain }}
          dnsNames:
          - (( object.metadata.name )).{{ .Values.nodeDomain }}
          duration: {{ .Values.certificate.duration }}
          renewBefore: {{ .Values.certificate.renewBefore }}
          privateKey:
            algorithm: RSA
            size: {{ .Values.certificate.keySize }}
            rotationPolicy: Always
          usages:
          - digital signature
          - key encipherment
          - server auth
          - client auth
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: {{ .Values.clusterIssuer }}
{{- end }}
