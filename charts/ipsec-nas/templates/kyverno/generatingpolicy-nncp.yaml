{{- if not .Values.kyverno.legacyPolicies }}
# One NNCP per Node, once ipsec-cert-sync has imported the node's certificate and labelled it.
# Kyverno 1.19 and later; the legacy ClusterPolicy is in templates/kyverno-legacy/.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: ipsec-nncp-per-node
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["nodes"]
  matchConditions:
  {{- include "ipsec-nas.nodeMatchConditions" (dict "root" $ "extra" (dict "ipsec.kcs.io/cert-ready" "true")) | nindent 2 }}
  generate:
  - template:
      interpolate: cel
      value: |
        apiVersion: nmstate.io/v1
        kind: NodeNetworkConfigurationPolicy
        metadata:
          name: ipsec-nas-(( object.metadata.name ))
        spec:
          nodeSelector:
            kubernetes.io/hostname: "(( object.metadata.labels['kubernetes.io/hostname'] ))"
          desiredState:
            interfaces:
            - name: ipsec-nas
              type: ipsec
              libreswan:
                left: "{{ .Values.ipsec.left | default (printf "(( object.metadata.name )).%s" .Values.nodeDomain) }}"
                leftid: '%fromcert'
                leftrsasigkey: '%cert'
                leftcert: left_server
                leftmodecfgclient: false
{{- with .Values.ipsec.leftprotoport }}
                leftprotoport: {{ . | quote }}
{{- end }}
                right: {{ .Values.ipsec.right | default .Values.nas.fqdn }}
                rightid: '%fromcert'
                rightrsasigkey: '%cert'
{{- with .Values.ipsec.rightca }}
                rightca: {{ . | quote }}
{{- end }}
                rightsubnet: {{ .Values.nas.ip }}/32
{{- with .Values.ipsec.rightprotoport }}
                rightprotoport: {{ . | quote }}
{{- end }}
                ikev2: insist
                type: {{ .Values.ipsec.type }}
{{- end }}
