{{- if and (not .Values.kyverno.legacyPolicies) .Values.nodeCleanup.deleteOrphanedSecrets }}
# When a Node is deleted, Kyverno deletes that node's Certificate (nodeCleanup.deleteCertificate).
# cert-manager leaves the Certificate's Secret behind, with the node's private key in it. This
# deletes such leftovers on a schedule: the cert-manager Secrets in this namespace whose Certificate
# no longer exists. It works in this namespace only and touches no other Certificate or Secret.
# A reboot does not delete the Node, so it never triggers this. Needs templates/cleanup-rbac.yaml.
apiVersion: policies.kyverno.io/v1
kind: NamespacedDeletingPolicy
metadata:
  name: ipsec-orphaned-node-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  schedule: {{ .Values.nodeCleanup.schedule | quote }}
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      resources: ["secrets"]
    objectSelector:
      matchLabels:
        controller.cert-manager.io/fao: "true"
  variables:
  # In a namespaced policy, resource.List reads this namespace only: (apiVersion, resource).
  - name: certificates
    expression: >-
      dyn(resource.List("cert-manager.io/v1", "certificates").items).map(c, c.metadata.name)
  conditions:
  - name: a-node-certificate-secret
    expression: object.metadata.name.startsWith("ipsec-cert-")
  - name: its-certificate-is-gone
    expression: >-
      !(object.metadata.?annotations[?"cert-manager.io/certificate-name"].orValue("") in variables.certificates)
{{- end }}
