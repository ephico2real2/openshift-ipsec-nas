{{- if .Values.metrics.prometheusRule }}
# Alerts on the per-node IPsec tunnel to the NAS. They appear under Observe > Alerting.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ipsec-nas
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: ipsec-cert-sync
spec:
{{- /* The "exporter missing" alert must not fire for excluded nodes: put their roles in, or take the clause out. */}}
{{- $rules := .Files.Get "files/prometheus-rule-groups.yaml" }}
{{- /* The alerts built on platform metrics carry this project's namespace label. */}}
{{- $rules = replace "namespace: kcs-ipsec" (printf "namespace: %s" .Release.Namespace) $rules }}
{{- $roles := include "ipsec-nas.excludedRoles" . }}
{{- if $roles }}
{{- $rules = replace "role=~\"control-plane|master|ingress\"" (printf "role=~\"%s\"" $roles) $rules }}
{{- else }}
{{- $rules = regexReplaceAll "(?m)^[ \\t]*# exclude-nodes:begin\\n.*\\n[ \\t]*# exclude-nodes:end\\n" $rules "" }}
{{- end }}
{{ $rules | trimSuffix "\n" | indent 2 }}
{{- end }}
