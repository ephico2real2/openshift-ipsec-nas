{{- if .Values.uninstallCleanup.enabled }}
# Runs files/uninstall.sh before the release is removed. uninstallCleanup.hook says for whom:
# "helm" makes these objects a Helm pre-delete hook, "argocd" an Argo CD PreDelete hook.
# The two cannot be combined: Argo CD ignores an object that carries a Helm pre-delete hook.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipsec-nas-uninstall
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
rules:
{{- if .Values.kyverno.legacyPolicies }}
- apiGroups: ["kyverno.io"]
  resources: ["clusterpolicies"]
{{- else }}
- apiGroups: ["policies.kyverno.io"]
  resources: ["generatingpolicies"]
{{- end }}
  resourceNames: ["ipsec-nncp-per-node", "ipsec-node-certificate"]
  verbs: ["get", "delete"]
- apiGroups: ["nmstate.io"]
  resources: ["nodenetworkconfigurationpolicies"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipsec-nas-uninstall
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipsec-nas-uninstall
subjects:
- kind: ServiceAccount
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ipsec-nas-uninstall
subjects:
- kind: ServiceAccount
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "-10" "root" $) | nindent 4 }}
data:
  uninstall.sh: |
{{ .Files.Get "files/uninstall.sh" | trimSuffix "\n" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ipsec-nas-uninstall
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "ipsec-nas.uninstallHook" (dict "weight" "0" "root" $) | nindent 4 }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ipsec-nas-uninstall
      restartPolicy: Never
      containers:
      - name: uninstall
        image: {{ .Values.images.cli }}
        command: ["/bin/bash", "/scripts/uninstall.sh"]
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REMOVE_CERTIFICATES
          value: {{ .Values.uninstallCleanup.removeCertificates | quote }}
        - name: POLICY_KIND
          value: {{ ternary "clusterpolicy" "generatingpolicy" .Values.kyverno.legacyPolicies }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: ipsec-nas-uninstall
          defaultMode: 0555
{{- end }}
