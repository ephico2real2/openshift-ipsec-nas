# Argo CD Application for the ipsec-nas chart.
# Kyverno, cert-manager and NMState are prerequisites and are NOT part of this Application.
# The chart's sync waves make Argo CD create the RBAC and ConfigMaps first, then the two Kyverno
# policies the DaemonSet depends on, then the DaemonSet, then the NNCP policy and the monitoring.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ipsec-nas
  namespace: openshift-gitops
  # Deleting the Application also deletes what it created. Argo CD 3.4.7 ran no cleanup hook first
  # (measured), which leaves the tunnels and keys on the nodes: remove it with the three steps of
  # docs/30-option-b-automated-helm-argocd.md, Step I.7, not by deleting the Application.
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ephico2real2/openshift-ipsec-nas.git
    targetRevision: main
    path: charts/ipsec-nas
    helm:
      releaseName: ipsec-nas
      valuesObject:
        nodeDomain: ocp.example.com
        nas:
          fqdn: nas01.example.com
          ip: 10.0.0.50
        clusterIssuer: company-issuer-rnd      # the EXISTING enterprise CA issuer
        trustCA:
          # The enterprise ROOT CA. Either name a ConfigMap that already exists in the namespace
          # (key ca.pem), or delete this line and paste the PEM under "pem: |".
          existingConfigMap: ipsec-trust-ca
        uninstallCleanup:
          hook: argocd     # a PreDelete hook, for an Argo CD that runs one (3.4.7 did not)
        kyverno:
          legacyPolicies: false   # the CEL policies, Kyverno 1.19 or later; true for an older Kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kcs-ipsec
  syncPolicy:
    # The cert-sync pod runs privileged, so the namespace needs these labels (docs/20-option-b-per-node-certificates.md, Step B.2)
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
        security.openshift.io/scc.podSecurityLabelSync: "false"
    syncOptions:
    - CreateNamespace=true
