# Values for OpenShift Local (CRC) with the lab NAS, as measured in docs/30-option-b-automated-helm-argocd.md.
# Tunnel mode, "%defaultroute" and the NAS IP as "right" are CRC-only settings (NAT, no DNS names).
# Also pass: --set-file trustCA.pem=enterprise-root.pem
nodeDomain: crc.testing
nas:
  fqdn: crc-nas.lab.internal
  ip: 192.168.64.8
clusterIssuer: enterprise-ca
# CRC's only node is control plane, master and worker at once, so those two cannot be excluded here.
excludeNodeLabels:
- node-role.kubernetes.io/ingress
ipsec:
  type: tunnel
  left: "%defaultroute"
  right: 192.168.64.8
