# ipsec-nas-option-c-metrics: Option C's per-node IPsec metrics, the same collector and alerts as Option B.
# NEVER deploy it together with Option B's ipsec-nas chart: one option per cluster (docs/50, CAUTION).
# The collector, the metrics server and the alert rules are SHARED CODE: shared/collector/, copied into files/.

# -- The nodes where Option C enables IPsec: its worker pool. On OpenShift Local the single node is also a worker,
# so the same selector picks it (values-crc.yaml only empties excludeNodeLabels).
nodeSelector:
  node-role.kubernetes.io/worker: ""

# -- Label KEYS that exclude a Node even if it matches nodeSelector. The roles among them are also left out of the
# "exporter missing" alert. An empty list excludes nothing.
excludeNodeLabels:
- node-role.kubernetes.io/control-plane
- node-role.kubernetes.io/master
- node-role.kubernetes.io/ingress

# -- Tolerations for the DaemonSet, for example for tainted nodes that mount the NAS.
tolerations: []

images:
  # -- The collector: a shell and oc's base image (it runs commands on the host through /host).
  cli: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
  # -- The metrics server.
  python: registry.access.redhat.com/ubi9/python-312:latest

serviceAccount:
  # -- The DaemonSet's ServiceAccount.
  name: ipsec-nas-metrics

scc:
  # -- Bind the privileged SCC to the ServiceAccount. The collector reads the host (privileged, runAsUser 0).
  bind: true

metrics:
  # Dynatrace: annotate the metrics Service so Dynatrace's in-cluster ActiveGate scrapes each pod
  # ("Monitor annotated Prometheus exporters", docs/62). Off by default.
  dynatrace:
    # -- Add the metrics.dynatrace.com annotations to the metrics Service.
    scrape: false
    # -- The metric names Dynatrace keeps (its filter accepts a prefix such as ipsec_nas_*).
    filter:
    - ipsec_nas_*
  # -- Headless Service and ServiceMonitor, for Observe. Needs user workload monitoring.
  serviceMonitor: true
  # -- The twelve alert rules (files/prometheus-rule-groups.yaml, shared with Option B).
  prometheusRule: true
  # -- The dashboard as a ConfigMap labelled grafana_dashboard: "1", for a Grafana dashboard sidecar in this
  # namespace or a central one searching it (as Option B's; docs/61-perses-dashboard-review.md). Off by default.
  grafanaDashboard: false
  # The dashboard in the OpenShift console (Observe -> Dashboards (Perses)), from the Cluster Observability
  # Operator 1.5 or later: a PersesDashboard and the PersesDatasource it queries, in this namespace.
  persesDashboard:
    # -- On by default: COO's Perses (the API perses.dev/v1alpha2) is then a prerequisite.
    enabled: true
    # -- Thanos Querier's cluster-wide port (Option B's choice, doc 61: 9092 refuses the Perses UI's POST queries).
    thanosURL: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091

# Option C itself, optional: each part is off by default, and the chart then installs only the metrics above.
# The names follow Option B's chart (charts/ipsec-nas). The MachineConfig is never made by this chart: it carries
# the private key and reboots its pool, so it stays a deliberate step: scripts/option-c-certificate.sh from-secret
# builds it from the certificate below (docs/53-option-c-cert-manager-kyverno.md).

# -- The nodes' DNS domain: the wildcard certificate is for *.<nodeDomain>; C2's identities are <node>.<nodeDomain>.
nodeDomain: ""

nas:
  # -- The NAS's DNS name (its certificate names it).
  fqdn: ""
  # -- The NAS address that carries NFS; only traffic to it is encrypted.
  ip: ""

# -- The EXISTING ClusterIssuer of the enterprise CA (oc get clusterissuer), for certificate.enabled. Never created here.
clusterIssuer: ""

ipsec:
  # -- transport, or tunnel only when there is NAT between the nodes and the NAS (OpenShift Local).
  type: transport
  # -- C2 only: the node's "left". Empty means the node's FQDN, <node>.<nodeDomain>; OpenShift Local: %defaultroute.
  left: ""
  # -- The tunnel's "right". Empty means nas.fqdn; the NAS's IP when it is reached through NAT (OpenShift Local).
  right: ""
  # -- Optional, as our enterprise standard for Linux hosts (docs/70, Sample 2); each is left out of the NNCP when empty.
  # rightca: '%same' accepts only a NAS certificate from the node certificate's own CA (measured: docs/evidence/crc/63).
  # rightca and the port selectors need OpenShift 4.19.22, 4.20.11, 4.21 or later (docs/70, "Which OpenShift versions").
  rightca: ""
  # -- Port selectors: with leftprotoport "tcp" and rightprotoport "tcp/2049", only NFS to the NAS goes through the
  # tunnel; other traffic to the NAS leaves the node in clear (an IPsec-only NAS drops it). The NAS must agree.
  leftprotoport: ""
  rightprotoport: ""

tunnel:
  # -- Create the tunnel, one object per pool (docs/50, Step C.5).
  enabled: false
  # -- c1: one NNCP per pool, every node presents the certificate's DN (no Kyverno). c2: a Kyverno policy per pool that
  # makes one NNCP per node, with the node's own name and address (Kyverno 1.19 or later). Both need the NAS to allow
  # duplicate peer IDs (uniqueids=no) with rightid=%fromcert: docs/50, "What the NAS must allow".
  variant: c1
  # -- The pools that have Option C's MachineConfig: worker, master, or both.
  pools:
  - worker

certificate:
  # -- Create the wildcard certificate with cert-manager: a Certificate for *.<nodeDomain> from clusterIssuer, with
  # the subject, key and usages of docs/50, Step C.1. Its Secret is what "option-c-certificate.sh from-secret" reads.
  enabled: false
  # -- The Secret cert-manager writes the key and the certificate into, in the release's namespace.
  secretName: ipsec-nas-wildcard
  # -- Two years, as docs/50 asks the CA for.
  duration: 17520h
  # -- cert-manager renews the Secret this long before expiry. The nodes keep the old certificate until the
  # MachineConfig is built and applied again: do that before the old one expires (docs/53, renewal).
  renewBefore: 720h
  keySize: 3072

kyvernoRBAC:
  # -- tunnel.variant c2: the two ClusterRoles that let Kyverno create NNCPs and read Nodes. false if Kyverno has them.
  create: true

prerequisites:
  # -- Skip the checks that the cluster serves NMState (tunnel), Kyverno 1.19 (c2) and cert-manager (certificate),
  # that clusterIssuer exists, and that Kyverno does not ignore Nodes. Only for rendering without a cluster.
  skipCheck: false
  # -- Where Kyverno runs: its ConfigMap "kyverno" is read to check that Nodes are not in its resourceFilters.
  kyvernoNamespace: kyverno
