{{- if .Values.metrics.grafanaDashboard }}
# The label grafana_dashboard: "1" is the convention Grafana dashboard sidecars watch for.
# files/ipsec-nas-option-c.json is GENERATED by scripts/perses-dashboard.sh from Option B's Grafana dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ipsec-nas-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: ipsec-nas-metrics
    grafana_dashboard: "1"
data:
  ipsec-nas-option-c.json: |
{{ .Files.Get "files/ipsec-nas-option-c.json" | trimSuffix "\n" | indent 4 }}
{{- end }}
