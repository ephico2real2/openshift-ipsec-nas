{{- if .Values.metrics.persesDashboard.enabled }}
# The Perses dashboard (Cluster Observability Operator 1.5 or later) and the datasource it queries, as Option B's.
# files/ipsec-nas-option-c.perses.json is GENERATED by scripts/perses-dashboard.sh from Option B's Grafana dashboard.
# Viewers need cluster-monitoring-view (Thanos port 9091): docs/61-perses-dashboard-review.md, "Decision".
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: ipsec-nas-thanos
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: ipsec-nas-metrics
spec:
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
  config:
    display:
      name: OpenShift Thanos (cluster)
    default: false
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: {{ .Values.metrics.persesDashboard.thanosURL }}
            # the Perses secret COO derives from spec.client.tls; the proxy must name it
            secret: ipsec-nas-thanos-secret
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: ipsec-nas
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: ipsec-nas-metrics
spec:
  config:
{{ .Files.Get "files/ipsec-nas-option-c.perses.json" | trimSuffix "\n" | indent 4 }}
{{- end }}
