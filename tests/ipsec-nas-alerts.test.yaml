# promtool unit tests for the alert rules in
# manifests/option-b-per-node-certs/29-prometheus-rule.yaml.
# tests/test-alert-rules.sh extracts the rules and runs these.
rule_files:
- ipsec-nas.rules.yaml

evaluation_interval: 1m

tests:
# One healthy worker, one whose tunnel goes down at minute 10, and a third worker with no exporter.
- interval: 1m
  input_series:
  - series: 'ipsec_nas_tunnel_up{node="worker-0",connection="ipsec-nas"}'
    values: '1x30'
  - series: 'ipsec_nas_tunnel_up{node="worker-1",connection="ipsec-nas"}'
    values: '1x9 0x20'
  - series: 'ipsec_nas_collect_success{node="worker-0"}'
    values: '1x30'
  - series: 'ipsec_nas_collect_success{node="worker-1"}'
    values: '1x30'
  # collected every minute: the timestamp advances with the clock
  - series: 'ipsec_nas_collect_timestamp_seconds{node="worker-0"}'
    values: '0+60x30'
  - series: 'ipsec_nas_collect_timestamp_seconds{node="worker-1"}'
    values: '0+60x30'
  - series: 'kube_node_role{node="worker-0",role="worker"}'
    values: '1x30'
  - series: 'kube_node_role{node="worker-1",role="worker"}'
    values: '1x30'
  - series: 'kube_node_role{namespace="openshift-monitoring",job="kube-state-metrics",node="worker-2",role="worker"}'
    values: '1x30'
  - series: 'kube_node_role{node="master-0",role="master"}'
    values: '1x30'
  # excluded nodes that ALSO carry the worker role, and run no exporter by design:
  # an ingress node, and a control-plane node of a compact cluster
  - series: 'kube_node_role{node="ingress-0",role="worker"}'
    values: '1x30'
  - series: 'kube_node_role{node="ingress-0",role="ingress"}'
    values: '1x30'
  - series: 'kube_node_role{node="compact-0",role="worker"}'
    values: '1x30'
  - series: 'kube_node_role{node="compact-0",role="control-plane"}'
    values: '1x30'
  alert_rule_test:
  # down since minute 10, "for: 5m" not yet served at minute 13
  - eval_time: 13m
    alertname: IpsecNasTunnelDown
    exp_alerts: []
  - eval_time: 16m
    alertname: IpsecNasTunnelDown
    exp_alerts:
    - exp_labels:
        severity: critical
        node: worker-1
        connection: ipsec-nas
      exp_annotations:
        summary: "Node worker-1 has no IPsec tunnel to the NAS"
        description: "NFS from this node to the NAS is not encrypted, or is failing if the NAS rejects cleartext. On the node: ipsec trafficstatus, then journalctl -u ipsec."
  # the worker without an exporter is reported after 15 minutes; the master and the excluded
  # nodes (ingress-0, compact-0) never are, although two of them carry the worker role
  - eval_time: 14m
    alertname: IpsecNasExporterMissing
    exp_alerts: []
  - eval_time: 16m
    alertname: IpsecNasExporterMissing
    exp_alerts:
    - exp_labels:
        severity: warning
        namespace: kcs-ipsec
        node: worker-2
        role: worker
      exp_annotations:
        summary: "Worker worker-2 reports no IPsec metrics"
        description: "No ipsec-cert-sync pod is being scraped on this worker, so nothing is watching its tunnel. oc get pods -n kcs-ipsec -o wide."
  - eval_time: 16m
    alertname: IpsecNasMetricsStale
    exp_alerts: []
  - eval_time: 16m
    alertname: IpsecNasLibreswanNotAnswering
    exp_alerts: []

# The collector stops at minute 5 (its timestamp freezes) and libreswan stops answering on another node.
- interval: 1m
  input_series:
  - series: 'ipsec_nas_collect_timestamp_seconds{node="worker-0"}'
    values: '0+60x5 300x25'
  - series: 'ipsec_nas_collect_success{node="worker-1"}'
    values: '1x4 0x26'
  alert_rule_test:
  # frozen at 300s; older than 300s from minute 11; plus "for: 5m"
  - eval_time: 14m
    alertname: IpsecNasMetricsStale
    exp_alerts: []
  - eval_time: 17m
    alertname: IpsecNasMetricsStale
    exp_alerts:
    - exp_labels:
        severity: warning
        node: worker-0
      exp_annotations:
        summary: "IPsec metrics from node worker-0 are 12m 0s old"
        description: "The collector container in the ipsec-cert-sync pod on that node has stopped writing."
  - eval_time: 11m
    alertname: IpsecNasLibreswanNotAnswering
    exp_alerts:
    - exp_labels:
        severity: warning
        node: worker-1
      exp_annotations:
        summary: "libreswan on node worker-1 does not answer"
        description: "The collector could not run \"ipsec trafficstatus\" on the node, so the tunnel state is unknown. On the node: systemctl status ipsec."

# Certificates: one with 10 days left, one already expired, one with 60 days left.
- interval: 1m
  input_series:
  - series: 'ipsec_nas_certificate_not_after_timestamp_seconds{node="worker-0",nickname="left_server"}'
    values: '864000x120'      # 10 days after time 0
  - series: 'ipsec_nas_certificate_not_after_timestamp_seconds{node="worker-1",nickname="left_server"}'
    values: '60x120'          # expired one minute in
  - series: 'ipsec_nas_certificate_not_after_timestamp_seconds{node="worker-2",nickname="left_server"}'
    values: '5184000x120'     # 60 days
  alert_rule_test:
  - eval_time: 30m
    alertname: IpsecNasCertificateExpiringSoon
    exp_alerts: []            # "for: 1h" not served yet
  - eval_time: 5m
    alertname: IpsecNasCertificateExpired
    exp_alerts:
    - exp_labels:
        severity: critical
        node: worker-1
        nickname: left_server
      exp_annotations:
        summary: "The IPsec certificate on node worker-1 has expired"
        description: "The NAS will refuse this node. Renew the Certificate ipsec-worker-1 in kcs-ipsec."

# Six nodes, each with one fault (w0 has none). Every alert must fire for its node and only that
# node: a multi-node cluster must not mix one node's data with another's.
- interval: 1m
  input_series:
  # the collector's heartbeat, with the labels a real scrape adds (pod, exporter_node)
  - series: 'ipsec_nas_collect_timestamp_seconds{node="w0",exporter_node="w0",pod="p0"}'
    values: '0+60x70'
  - series: 'ipsec_nas_collect_timestamp_seconds{node="w1",exporter_node="w9",pod="p1"}'
    values: '0+60x70'
  - series: 'ipsec_nas_collect_timestamp_seconds{node="w2",exporter_node="w2",pod="p2a"}'
    values: '0+60x70'
  - series: 'ipsec_nas_collect_timestamp_seconds{node="w2",exporter_node="w2",pod="p2b"}'
    values: '0+60x70'
  - series: 'ipsec_nas_tunnel_up{node="w0",connection="ipsec-nas"}'
    values: '1x70'
  - series: 'ipsec_nas_tunnel_up{node="w3",connection="ipsec-nas"}'
    values: '0x70'
  - series: 'ipsec_nas_certificate_present{node="w0",nickname="left_server"}'
    values: '1x70'
  - series: 'ipsec_nas_certificate_present{node="w3",nickname="left_server"}'
    values: '0x70'
  - series: 'ipsec_nas_certificate_present{node="w4",nickname="left_server"}'
    values: '1x70'
  - series: 'ipsec_nas_connection_configured{node="w0",connection="ipsec-nas"}'
    values: '1x70'
  - series: 'ipsec_nas_connection_configured{node="w3",connection="ipsec-nas"}'
    values: '0x70'
  - series: 'ipsec_nas_connection_configured{node="w4",connection="ipsec-nas"}'
    values: '0x70'
  # w0's tunnel stays; w5's is re-established every 10 minutes
  - series: 'ipsec_nas_tunnel_established_timestamp_seconds{node="w0",connection="ipsec-nas"}'
    values: '100x70'
  - series: 'ipsec_nas_tunnel_established_timestamp_seconds{node="w5",connection="ipsec-nas"}'
    values: '0x9 600x9 1200x9 1800x9 2400x9 3000x29'
  # the platform's node-exporter: NFS requests on w0 (tunnel up) and on w3 (tunnel down)
  - series: 'node_nfs_requests_total{instance="w0",method="WRITE",proto="4"}'
    values: '0+30x70'
  - series: 'node_nfs_requests_total{namespace="openshift-monitoring",job="node-exporter",instance="w3",method="WRITE",proto="4"}'
    values: '0+30x70'
  alert_rule_test:
  - eval_time: 6m
    alertname: IpsecNasNodeLabelMismatch
    exp_alerts:
    - exp_labels: {severity: warning, node: w1, exporter_node: w9, pod: p1}
      exp_annotations:
        summary: "The pod p1 reports node w1 but runs on w9"
        description: "Metrics are pinned to the wrong node. Check the DaemonSet's NODE_NAME (downward API spec.nodeName)."
  - eval_time: 11m
    alertname: IpsecNasDuplicateNode
    exp_alerts:
    - exp_labels: {severity: warning, node: w2}
      exp_annotations:
        summary: "2 pods report IPsec metrics for node w2"
        description: "Only one ipsec-cert-sync pod should run per node. oc get pods -n kcs-ipsec -o wide."
  - eval_time: 11m
    alertname: IpsecNasCertificateMissing
    exp_alerts:
    - exp_labels: {severity: critical, node: w3, nickname: left_server}
      exp_annotations:
        summary: "Node w3 has no IPsec certificate in its NSS database"
        description: "No tunnel can come up without it. Check the cert-sync pod's log on that node and the Certificate in kcs-ipsec."
  # w4 has its certificate and no connection; w3 has neither and is not reported here
  - eval_time: 16m
    alertname: IpsecNasConnectionMissing
    exp_alerts:
    - exp_labels: {severity: warning, node: w4, connection: ipsec-nas}
      exp_annotations:
        summary: "Node w4 has its certificate but no ipsec-nas connection"
        description: "The NNCP was not applied to this node. oc get nncp,nnce | grep ipsec-nas; check the Kyverno NNCP policy."
  - eval_time: 65m
    alertname: IpsecNasTunnelFlapping
    exp_alerts:
    - exp_labels: {severity: warning, node: w5, connection: ipsec-nas}
      exp_annotations:
        summary: "The tunnel of node w5 was re-established 5 times in an hour"
        description: "A tunnel that keeps restarting looks up on every other panel. On the node: journalctl -u ipsec; on the NAS: duplicate peer IDs."
  # NFS runs on w0 and w3; only w3's tunnel is down
  - eval_time: 12m
    alertname: IpsecNasNfsWithoutTunnel
    exp_alerts:
    - exp_labels: {severity: critical, namespace: kcs-ipsec, node: w3}
      exp_annotations:
        summary: "Node w3 sends NFS requests while its IPsec tunnel is down"
        description: "The NFS traffic is not encrypted, or is failing if the NAS rejects cleartext. Counts all NFS servers of the node."

# The collector pod of w6 was replaced half-way through: its restarts are split across two series
# (2 under pod a, 2 under pod b). Counted per series neither passes 3; per node it is 4 and fires.
- interval: 1m
  input_series:
  - series: 'ipsec_nas_tunnel_established_timestamp_seconds{node="w6",connection="ipsec-nas",pod="a"}'
    values: '0x9 600x9 1200x9 _x34'
  - series: 'ipsec_nas_tunnel_established_timestamp_seconds{node="w6",connection="ipsec-nas",pod="b"}'
    values: '_x30 1800x9 2400x9 3000x15'
  alert_rule_test:
  - eval_time: 55m
    alertname: IpsecNasTunnelFlapping
    exp_alerts:
    - exp_labels: {severity: warning, node: w6, connection: ipsec-nas}
      exp_annotations:
        summary: "The tunnel of node w6 was re-established 4 times in an hour"
        description: "A tunnel that keeps restarting looks up on every other panel. On the node: journalctl -u ipsec; on the NAS: duplicate peer IDs."
